<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<title>Pas de connexion · Stokito</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafafa; color: #18181b; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 32px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 6px; color: #52525b; line-height: 1.5; font-size: 15px; }
    p[dir=rtl] { font-family: Tahoma, Arial, sans-serif; }
    button { margin-top: 18px; height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #18181b; color: #fff; font: 600 15px inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
    <img src="/images/brand/icon-192.png" alt="Stokito">
    <h1>Pas de connexion internet</h1>
    <p>Stokito a besoin d’internet pour ouvrir et enregistrer vos documents. Vérifiez votre connexion, puis réessayez.</p>
    <p dir="rtl">لا يوجد اتصال بالإنترنت. تحقق من الاتصال ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
